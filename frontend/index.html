<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Price Prediction</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="overlay">

<div class="container">

<div class="card glass-card">

<div class="text-center mb-4">

<i class="fa-solid fa-car-side car-icon"></i>

<h1>Car Price Prediction</h1>

<p>Predict the resale value of your car using Machine Learning</p>

</div>

<form id="predictionForm">

<div class="row">

<div class="col-md-6 mb-3">
<label>Company</label>
<select class="form-select" id="company" required>
<option value="">Select Company</option>
<option>Toyota</option>
<option>Hyundai</option>
<option>Honda</option>
<option>Maruti</option>
<option>Ford</option>
<option>BMW</option>
<option>Audi</option>
</select>
</div>

<div class="col-md-6 mb-3">
<label>Model</label>
<input type="text" id="model" class="form-control" placeholder="Car Model">
</div>

<div class="col-md-6 mb-3">
<label>Manufacturing Year</label>
<input type="number" id="year" class="form-control" placeholder="2020">
</div>

<div class="col-md-6 mb-3">
<label>Fuel Type</label>
<select id="fuel" class="form-select">
<option>Petrol</option>
<option>Diesel</option>
<option>CNG</option>
<option>Electric</option>
</select>
</div>

<div class="col-md-6 mb-3">
<label>Transmission</label>
<select id="transmission" class="form-select">
<option>Manual</option>
<option>Automatic</option>
</select>
</div>

<div class="col-md-6 mb-3">
<label>KM Driven</label>
<input type="number" id="km" class="form-control">
</div>

<div class="col-md-6 mb-3">
<label>Mileage (km/l)</label>
<input type="number" id="mileage" class="form-control">
</div>

<div class="col-md-6 mb-3">
<label>Engine (CC)</label>
<input type="number" id="engine" class="form-control">
</div>

<div class="col-md-6 mb-3">
<label>Horse Power</label>
<input type="number" id="hp" class="form-control">
</div>

<div class="col-md-6 mb-3">
<label>Seats</label>
<input type="number" id="seats" class="form-control">
</div>

</div>

<div class="text-center mt-3">

<button type="submit" class="btn btn-primary btn-lg predict-btn">
<i class="fa-solid fa-chart-line"></i>
Predict Price
</button>

<button type="reset" class="btn btn-outline-light btn-lg">
Reset
</button>

</div>

</form>

<div class="result-box mt-4">

<h3>
Estimated Price
</h3>

<h2 id="price">
₹ --
</h2>

</div>

</div>

<footer>

<p>
© 2026 Car Price Prediction | Machine Learning Project
</p>

</footer>

</div>

</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
